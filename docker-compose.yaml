services:
  mongodb:
    build: ./mongodb
    image: mongodb:4.4
    container_name: mongodb
    volumes:
      - mongodb:/data/db
  mysql:
    build: ./mysql
    image: mysql:8
    container_name: mysql
    volumes:
      - mysql:/var/lib/mysql
  redis:
    image: redis:7.0
    container_name: redis
    volumes:
      - redis:/data
  rabbitmq:
    image: rabbitmq:3
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    container_name: rabbitmq
      volumes:
        - rabbitmq:/var/lib/rabbitmq
  catalogue:
    build: ./catalogue
    image: manjukarri/catalogue:1.0.0
    container_name: catalogue
    depends_on:
      - mongodb
  user:
    build: ./user
    image: manjukarri/user:1.0.0
    container_name: user  
    depends_on:
      - mongodb
      - redis
  cart:
    build: ./cart 
    image: manjukarri/cart:1.0.0
    container_name: cart
    depends_on:
      - redis
      - catalogue
  shipping:
    build: ./shipping
    image: manjukarri/shipping:1.0.0    
    container_name: shipping
    depends_on:
      - mysql
      - cart
  payment:
    build: ./payment
    image: manjukarri/payment:1.0.0     
    container_name: payment
    environment:
      - CART_HOST=cart
      - CART_PORT=8080
      - USER_HOST=user  
      - USER_PORT=8080
      - AMQP_HOST=rabbitmq
      - AMQP_USER=roboshop
      - AMQP_PASSWORD=roboshop123
    depends_on:
      - rabbitmq
      - cart
      - user
  frontend:
    build: ./frontend
    image: manjukarri/frontend:1.0.0    
    container_name: frontend
    ports:  
      - "80:80"
    depends_on:
      - catalogue
      - user
      - cart
      - shipping
      - payment    

networks:
  default:
    name: roboshop  
    driver: bridge
    external: false
volumes:
  mongodb: 
  mysql:
  redis:
  rabbitmq:    